<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Çizgi Film Maratonu — Smart TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">MARATON PLAYER</div>
        <h1>Çizgi Film Maratonu</h1>
        <p class="muted">Bölüm bitince sıradaki diziye otomatik geçer.</p>
      </div>
      <button id="settingsBtn" class="secondary" tabindex="1">⚙ Ayarlar</button>
    </header>

    <section class="player-card">
      <div class="player-area" style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000;">
        <!-- Reklamsız Embed Frame -->
        <iframe id="player" style="width: 100%; height: 100%; border: 0; background: #000;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        
        <div id="adPanel" class="ad-panel hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10;">
          <div class="ad-title">📢 Reklam arası</div>
          <div>Sonraki bölüme geçiliyor… <strong id="adCountdown">30</strong> sn</div>
        </div>
      </div>

      <div class="now">
        <div>
          <span class="label">Şimdi</span>
          <h2 id="nowTitle">Maraton hazır</h2>
        </div>
        <div class="next">
          <span class="label">Sıradaki</span>
          <strong id="nextTitle">—</strong>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="startBtn" class="primary" tabindex="2">▶ Maratonu Başlat</button>
      <button id="pauseBtn" class="secondary" tabindex="3">⏸ Duraklat</button>
      <button id="nextBtn" class="secondary" tabindex="4">⏭ Sonraki</button>
      <button id="resetBtn" class="danger" tabindex="5">↻ Baştan</button>
    </section>

    <section class="info-grid">
      <div class="panel">
        <span class="label">Maraton sırası</span>
        <div id="queue"></div>
      </div>
      <div class="panel">
        <span class="label">Durum</span>
        <p id="status">API anahtarı ayarlanmadı.</p>
        <p class="muted small">YouTube Data API anahtarı Ayarlar bölümüne girilmelidir.</p>
      </div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>Ayarlar</h2>
      <label>YouTube Data API Key
        <input id="apiKey" type="password" autocomplete="off" placeholder="AIza..." tabindex="6">
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary" tabindex="7">İptal</button>
        <button value="save" class="primary" tabindex="8">Kaydet</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
